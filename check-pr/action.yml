name: 'Release Drafter - Check PR'
description: 'Check whether a pull request title or labels match configured categories.'
author: release-drafter
branding:
  icon: check-circle
  color: orange
runs:
  using: node24
  main: ../dist/actions/check-pr/run.js
inputs:
  config-name:
    description: |
      Release Drafter configuration target.
      A relative path starts in the repository's `.github` directory.
    required: false
    default: release-drafter.yml
  token:
    description: |
      Access token for configuration reads. Default: github.token.
    default: ${{ github.token }}

outputs:
  labels:
    description: A JSON array of unique, sorted PR labels matched by configuration conditions under Check PR validation rules, including prefilter matches for skipped PRs. Empty results are [].
