name: 'Release Drafter'
description: 'Draft release notes when pull requests merge into a branch.'
author: release-drafter
branding:
  icon: edit-2
  color: orange
runs:
  using: node24
  main: dist/actions/drafter/run.js

inputs:
  config-name:
    description: |
      Release Drafter configuration target.
      A relative path starts in the repository's `.github` directory.
    required: false
    default: release-drafter.yml
  token:
    description: |
      Access token for GitHub API requests. Default: github.token.
    default: ${{ github.token }}
  name:
    description: |
      Release name. This value overrides `name-template`.
    required: false
  tag:
    description: |
      Release tag. This value overrides `tag-template`.
    required: false
  version:
    description: |
      Release version. This value overrides the calculated version.
    required: false
  from:
    description: |
      Ref, tag, branch, or commit SHA to use as the change comparison baseline.
      This value does not select the release version or the draft release to update.
    required: false
  publish:
    description: |
      Publishes the created or updated release immediately.
    required: false
    default: ''
  latest:
    description: |
      Marks the created or updated release as latest.
    required: false
    default: ''
  prerelease:
    description: |
      Creates a prerelease and includes changes since the previous prerelease when one exists. Default: `false`.
    required: false
    default: ''
  prerelease-identifier:
    description: |
      Prerelease identifier, such as `alpha`, `beta`, or `rc`.
      This input enables `prerelease`.
    required: false
    default: ''
  include-pre-releases:
    description: |
      Includes prereleases when Release Drafter selects the last published release.
      This input has no effect when `prerelease` is `true`. Default: `false`.
    required: false
    default: ''
  commitish:
    description: |
      Release target. Use a branch, commit SHA, fully qualified tag, or pull request ref.
      Release Drafter resolves tag and pull request refs to commit SHAs.
      A pull request merge ref forces dry-run mode because its merge commit is temporary.
      Default: the workflow branch.
    required: false
    default: ''
  header:
    description: |
      Text to add before the template body.
    required: false
    default: ''
  footer:
    description: |
      Text to add after the template body.
    required: false
    default: ''
  dry-run:
    description: |
      Prevents write operations. The action logs the proposed release operation.
    required: false
    default: ''
  filter-by-range:
    description: |
      Filter releases whose tag names satisfy this SemVer range.
    required: false
    default: ''

outputs:
  id:
    description: The ID of the release that was created or updated.
  name:
    description: The name of the release.
  tag_name:
    description: The name of the tag associated with the release.
  body:
    description: The body of the drafted release.
  html_url:
    description: The URL for viewing the release.
  upload_url:
    description: The URL for uploading release assets.
  major_version:
    description: The major component of the resolved version.
  minor_version:
    description: The minor component of the resolved version.
  patch_version:
    description: The patch component of the resolved version.
  resolved_version:
    description: The resolved version number.
