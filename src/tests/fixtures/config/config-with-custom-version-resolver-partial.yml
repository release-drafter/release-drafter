name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
branches:
  - master
categories:
  - title: '🚀 Features'
    label: 'feature'
  - title: '🐛 Bug fixes'
    label: 'bug'
  - title: '📄 Documentation'
    label: 'documentation'
  - title: '🧰 Maintenance'
    label: 'maintenance'
change-template: '- $CHANGE_TITLE @$CHANGE_AUTHOR ($CHANGE_REFERENCE)'
template: dummy
version-resolver:
  major:
    labels:
      - 'major'
  default: minor
exclude-labels:
  - skip-changelog
