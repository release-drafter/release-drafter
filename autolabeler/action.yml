name: 'Release Drafter - Auto Labeler'
description: 'Automatically labels pull requests based on your configuration.'
author: release-drafter
branding:
  icon: edit-2
  color: orange
runs:
  using: node24
  main: ../dist/actions/autolabeler/run.js
inputs:
  token:
    description: |
      Access token used to make requests against the GitHub API. Defaults to github.token.
    default: ${{ github.token }}
  config-name:
    description: |
      Configuration filename to use when the workflow has more than one Autolabeler configuration.
      Store the file in `.github`; Release Drafter searches only that directory.
    required: false
    default: release-drafter.yml
  dry-run:
    description: |
      A boolean indicating whether to run without performing any write operations.
      When enabled, the action logs what it would have done instead of adding labels.
    required: false
    default: ''

outputs:
  number:
    description: The pull request number that was evaluated.
  labels:
    description: A comma-separated list of labels matched by the configuration.
