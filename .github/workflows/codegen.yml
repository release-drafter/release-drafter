name: Update GraphQL Codegen

on:
  schedule:
    # First day of the month at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  codegen:
    name: Regenerate GraphQL types
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Run codegen
        run: vp run generate:graphql

      - name: Rebuild dist and run validation
        run: vp run ci

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'chore: update generated GraphQL types'
          title: 'chore: update generated GraphQL types'
          body: |
            Automated monthly update of GitHub GraphQL schema types.

            Generated by `vp run generate:graphql`.

            > [!WARNING]
            > CI checks require workflow approval. A maintainer with write access must select "Approve workflows to run" before merging.
          branch: chore/codegen-update
          delete-branch: true
          labels: 'type: maintenance'
