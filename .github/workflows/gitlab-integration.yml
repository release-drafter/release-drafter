name: GitLab Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'

permissions:
  contents: read

concurrency:
  group: gitlab-integration
  cancel-in-progress: false

jobs:
  gitlab:
    name: GitLab CE Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Run GitLab CE integration suite
        timeout-minutes: 30
        env:
          GITLAB_TEST_ARTIFACTS: artifacts/gitlab
        run: npm run test:conformance:gitlab

      - name: Upload GitLab failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitlab-integration-logs
          path: artifacts/gitlab
          if-no-files-found: warn
          retention-days: 7
