name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'release-drafter/release-drafter'
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Run all checks and rebuild artifacts
        run: npm run all

      - name: Check for clean working directory
        run: npm run check:clean

      - name: Publish Release
        id: release
        uses: ./
        with:
          tag: ${{ github.ref_name }}
          publish: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Update major tag v${{ steps.release.outputs.major_version }}
        if: steps.release.outputs.prerelease != 'true'
        env:
          MAJOR: ${{ steps.release.outputs.major_version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          git tag "v${MAJOR}" "${RELEASE_TAG}" -f
          git push origin "refs/tags/v${MAJOR}" -f

  publish-npm:
    if: github.repository == 'release-drafter/release-drafter'
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Install npm with staged publishing support
        run: npm install --global npm@12.0.1

      - run: npm ci

      - name: Build npm package
        run: npm run build

      - name: Stage npm package
        run: |
          if [[ "${{ needs.build.outputs.prerelease }}" == "true" ]]; then
            npm stage publish --tag next
          else
            npm stage publish
          fi
