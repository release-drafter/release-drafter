name: npm Package Readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-readiness:
    name: Package publication readiness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Select the tested npm version
        run: npm install --global npm@12.0.1 --ignore-scripts

      - run: npm ci

      - name: Build, consume, pack, and dry-run the public facade
        run: npm run test:package-readiness

      - name: Verify package checks left the checkout clean
        run: npm run check:clean
