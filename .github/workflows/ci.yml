name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-pr-title:
    name: 'Lint PR Title'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 'Validate conventional pull request title'
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          validateSingleCommit: false

  smoke-test-drafter:
    name: 'Smoke Test for Drafter'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: ./
        with:
          config-name: file:release-drafter.tests.yml
          dry-run: true

  smoke-test-autolabeler:
    name: 'Smoke Test for Autolabeler'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: ./autolabeler
        with:
          config-name: file:release-drafter.autolabeler.tests.yml
          dry-run: true

  tests:
    name: Tests & Build-Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Run all checks and rebuild artifacts
        run: npm run all

      - name: Upload coverage summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error

      - name: Check for clean working directory
        run: npm run check:clean

  forge-conformance:
    name: Forge conformance (${{ matrix.forge }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        forge:
          - gitea
          - forgejo
          - gitlab

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Run pinned real-forge conformance suite
        env:
          GITLAB_TEST_ARTIFACTS: artifacts/gitlab
        run: npm run test:conformance:${{ matrix.forge }}

      - name: Upload GitLab failure logs
        if: failure() && matrix.forge == 'gitlab'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitlab-integration-logs
          path: artifacts/gitlab
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: tests
    env:
      COVERAGE_THRESHOLD: '90'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Downloads the artifact named below from this workflow run; `needs: tests` ensures that upload finished first.
      - name: Download coverage summary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-summary
          path: coverage

      - name: Generate coverage summary
        id: coverage
        run: |
          COVERAGE=$(npm run --silent coverage)
          echo "pct=$COVERAGE" >> "$GITHUB_OUTPUT"

      - name: Enforce coverage threshold
        env:
          COVERAGE_PCT: ${{ steps.coverage.outputs.pct }}
          COVERAGE_MIN: ${{ env.COVERAGE_THRESHOLD }}
        run: |
          node --input-type=module <<'EOF'
          const pct = Number(process.env.COVERAGE_PCT)
          const min = Number(process.env.COVERAGE_MIN)

          if (Number.isNaN(pct)) {
            throw new Error(`Invalid coverage percentage: ${process.env.COVERAGE_PCT}`)
          }

          if (pct < min) {
            console.error(
              `Coverage ${pct.toFixed(2)}% is below required ${min.toFixed(0)}%`,
            )
            process.exit(1)
          }

          console.log(
            `Coverage ${pct.toFixed(2)}% meets required ${min.toFixed(0)}%`,
          )
          EOF
