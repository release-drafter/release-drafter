name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  action-smoke-tests:
    name: 'Action smoke tests'
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./
        with:
          config-name: file:release-drafter.tests.yml
          dry-run: true

      - uses: ./autolabeler
        if: github.event_name == 'pull_request'
        with:
          config-name: file:release-drafter.autolabeler.tests.yml
          dry-run: true

  tests:
    name: Tests & Build-Checks
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: '90'
      BRANCH_COVERAGE_THRESHOLD: '90'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Run all checks and rebuild artifacts
        run: npm run ci

      - name: Check for clean working directory
        run: npm run check:clean

      - name: Report coverage
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: npm run coverage
