name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-pr-title:
    name: 'Lint PR Title'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 'Validate conventional pull request title'
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          validateSingleCommit: false

  action-smoke-tests:
    name: 'Action smoke tests'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: ./
        with:
          config-name: file:release-drafter.tests.yml
          dry-run: true

      - uses: ./autolabeler
        if: github.event_name == 'pull_request'
        with:
          config-name: file:release-drafter.autolabeler.tests.yml
          dry-run: true

  tests:
    name: Tests & Build-Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Run all checks and rebuild artifacts
        run: npm run ci

      - name: Check for clean working directory
        run: npm run check:clean

      - name: Enforce coverage threshold
        env:
          COVERAGE_THRESHOLD: '90'
        run: npm run coverage
