name: Close Stale Issues

on:
  schedule:
    # Run every day at 2:00 AM UTC
    - cron: '0 2 * * *'

permissions:
  actions: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operations-per-run: 1000
          # Only process issues with the info-needed label (can have other labels too)
          any-of-issue-labels: 'info-needed'
          # Days before an issue with the info-needed label is considered stale
          days-before-issue-stale: 30
          # Days before closing a stale issue (7 day delay after marking as stale)
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          close-issue-label: 'closed-by-stale'
          # Remove stale label when issue receives comments/updates
          remove-issue-stale-when-updated: true
          # Process only pull requests awaiting contributor acknowledgement
          only-pr-labels: 'awaiting-acknowledgement'
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: 'stale-awaiting-acknowledgement'
          close-pr-label: 'closed-by-stale'
          remove-pr-stale-when-updated: true
          # Customized messages
          stale-issue-message: |
            This issue has been inactive for 30 days with the `info-needed` label.
            Please provide the requested information to keep this issue open.
            This issue will be closed in 7 days if no response is provided.
          close-issue-message: |
            This issue has been closed because it has been inactive for 30 days with the `info-needed` label and no information was provided.
            If you have additional context or want to reopen this issue, please comment and we'll be happy to help!
          stale-pr-message: |
            This pull request has been inactive for 14 days and is still awaiting the required contributor policy acknowledgement.
            Please follow the acknowledgement instructions above. This pull request will be closed in 7 days if no response is provided.
          close-pr-message: |
            This pull request has been closed because the required contributor policy acknowledgement was not provided.
            You may reopen it and post the acknowledgement described above to continue.
