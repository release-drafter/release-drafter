name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  # What's Changed

  $CHANGES

  ## New Contributors

  $NEW_CONTRIBUTORS

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

categories:
  - title: 'Breaking'
    semver-increment: 'major'
    when:
      conventional:
        breaking: true
  - title: 'New'
    semver-increment: 'minor'
    when:
      conventional:
        type: 'feat'
  - title: 'Bug Fixes'
    semver-increment: 'patch'
    when:
      conventional:
        type: 'fix'
  - title: 'Maintenance'
    semver-increment: 'patch'
    when:
      conventional:
        types:
          - 'build'
          - 'chore'
          - 'ci'
          - 'perf'
          - 'refactor'
          - 'revert'
          - 'style'
          - 'test'
  - title: 'Documentation'
    semver-increment: 'patch'
    when:
      conventional:
        type: 'docs'
  - title: 'Other changes'
  - title: 'Dependency Updates'
    semver-increment: 'patch'
    when:
      conventional:
        scopes:
          - 'deps'
          - 'deps-dev'
        types:
          - 'build'
          - 'chore'
    collapse-after: 5
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      conventional:
        scope: 'deps'
        type: 'fix'
  - type: 'pre-exclude'
    when:
      label: 'skip-changelog'
