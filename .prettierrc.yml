# Markdown only; Biome owns every other language but cannot format Markdown.

printWidth: 80
# Keep authored line breaks. Reflowing rewraps prose that reads fine and, since
# a URL cannot be broken, pushes long links onto their own line.
proseWrap: preserve
tabWidth: 2
useTabs: false
endOfLine: lf

# Applied to code in fenced blocks. Mirrors `javascript.formatter` in
# biome.jsonc; keep in sync.
singleQuote: true
semi: false
quoteProps: as-needed
trailingComma: all
bracketSpacing: true
bracketSameLine: false
arrowParens: always
