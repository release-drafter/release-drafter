# Markdown only; Biome owns every other language but cannot format Markdown.

printWidth: 80
proseWrap: always
tabWidth: 2
useTabs: false
endOfLine: lf

# Applied to code in fenced blocks. Mirrors `javascript.formatter` in
# biome.jsonc; keep in sync.
singleQuote: true
semi: false
quoteProps: as-needed
trailingComma: all
bracketSpacing: true
bracketSameLine: false
arrowParens: always
